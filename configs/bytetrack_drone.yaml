# ByteTrack tuned for small, fast drones.
# Lower thresholds keep weak detections of tiny targets in the second
# association stage; a longer buffer survives short occlusions / misses.
tracker_type: bytetrack
track_high_thresh: 0.35
track_low_thresh: 0.05
new_track_thresh: 0.4
track_buffer: 60
match_thresh: 0.85
fuse_score: true
